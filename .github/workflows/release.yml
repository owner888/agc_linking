name: Build & Release APK

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0+5 or v2.0.0_b5)'
        required: false
        default: 'v2.0.0+5'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XDEBUG_MODE: "off"
    steps:
      - name: Checkout agc_linking
        uses: actions/checkout@v4
        with:
          path: agc_linking
          fetch-depth: 0

      - name: Checkout myphp framework
        uses: actions/checkout@v4
        with:
          repository: owner888/myphp
          path: myphp

      - name: Set up PHP 8.4 (with ext-ffi)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi, mbstring, curl, openssl, dom, xml, zip, phar
          ini-values: ffi.enable=1
          coverage: none

      - name: Set up Go (for Xray)
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build VPN native libraries (Xray, hev-socks5-tunnel)
        working-directory: agc_linking
        env:
          ANDROID_NDK: ${{ env.ANDROID_NDK_LATEST_HOME }}
          ABIS: arm64-v8a
        run: scripts/build-native.sh

      - name: Fetch routing data (geoip, geosite)
        working-directory: agc_linking
        run: scripts/fetch-geo.sh

      - name: Sync version & build number from tag into myphp.json
        id: meta
        working-directory: agc_linking
        run: |
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          RUN_NUM="${{ github.run_number }}"
          php -r '
            $f = "myphp.json";
            $c = json_decode(file_get_contents($f), true) ?: [];
            $rawTag = $argv[1];
            $runNum = (int)$argv[2];
            $clean = preg_replace("/_(Android|APK|Test|iOS|macOS)$/i", "", ltrim($rawTag, "vV"));
            if (preg_match("/^([0-9]+\.[0-9]+\.[0-9]+)(?:[+_b-]+([0-9]+))?$/i", $clean, $m)) {
                $ver = $m[1];
                $build = !empty($m[2]) ? (int)$m[2] : max((int)($c["buildNumber"] ?? 1), $runNum);
            } else {
                [$ver] = explode("+", (string)($c["version"] ?? "2.0.0"), 2);
                $build = max((int)($c["buildNumber"] ?? 1), $runNum);
            }
            $c["version"] = "{$ver}+{$build}";
            $c["buildNumber"] = $build;
            file_put_contents($f, json_encode($c, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n");
            $out = getenv("GITHUB_OUTPUT");
            file_put_contents($out, "tag={$rawTag}\nversion={$ver}\nbuild={$build}\n", FILE_APPEND);
          ' "$RAW_TAG" "$RUN_NUM"

      - name: Run Headless UI Tests
        working-directory: agc_linking
        run: php -d ffi.enable=1 tests/ui_test.php

      - name: Build Android APK via myphp
        working-directory: agc_linking
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          php -d ffi.enable=1 ../myphp/bin/myphp build -platform android/arm64 .
          APK_VERSIONED="Linking_${{ steps.meta.outputs.version }}_b${{ steps.meta.outputs.build }}.apk"
          cp build/Linking.apk "build/${APK_VERSIONED}"
          (cd build && sha256sum Linking.apk "${APK_VERSIONED}" > SHA256SUMS)
          ls -lh build/

      - name: Publish APK to GitHub Releases
        working-directory: agc_linking
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          BUILD="${{ steps.meta.outputs.build }}"
          APK_VERSIONED="Linking_${VERSION}_b${BUILD}.apk"
          NOTES="$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null || true)"
          if [ -z "$NOTES" ]; then
            NOTES="$(git log -1 --no-merges --pretty=%B)"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Linking v${VERSION} (${BUILD})" \
              --notes "$NOTES"
          fi

          gh release upload "$TAG" \
            build/Linking.apk \
            "build/${APK_VERSIONED}" \
            build/SHA256SUMS \
            --clobber
